name: candidate

on:
  workflow_call:
    inputs:
      source_ref: { required: true, type: string }
      spec_artifact_name: { required: true, type: string }
      spec_artifact_digest: { required: true, type: string }
      spec_candidate_manifest_sha256: { required: true, type: string }
      spec_source_commit: { required: true, type: string }
      contract_artifact_name: { required: true, type: string }
      contract_artifact_digest: { required: true, type: string }
      contract_candidate_manifest_sha256: { required: true, type: string }
      contract_source_commit: { required: true, type: string }
    outputs:
      artifact_name: { value: ${{ jobs.candidate.outputs.artifact_name }} }
      artifact_id: { value: ${{ jobs.candidate.outputs.artifact_id }} }
      artifact_digest: { value: ${{ jobs.candidate.outputs.artifact_digest }} }
      candidate_manifest_sha256: { value: ${{ jobs.candidate.outputs.candidate_manifest_sha256 }} }
      source_commit: { value: ${{ jobs.candidate.outputs.source_commit }} }

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow_ref }}-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
      candidate_manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve this workflow's owner repository
        id: source-owner
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          repository=${WORKFLOW_REF%%/.github/workflows/*}
          case "$repository" in */*) ;; *) echo "workflow_ref has no owner repository" >&2; exit 1 ;; esac
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Check out the exact kit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.source-owner.outputs.repository }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact source commit
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          case "$SOURCE_REF" in *[!a-f0-9]*|'') echo "source_ref is invalid" >&2; exit 1 ;; esac
          test "${#SOURCE_REF}" -eq 40
          commit=$(git -C source rev-parse HEAD)
          test "$commit" = "$SOURCE_REF"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Download the exact spec candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.spec_artifact_name }}
          path: spec-candidate
      - name: Download the exact contract candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.contract_artifact_name }}
          path: contract-candidate
      - name: Verify the spec validation input
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.spec_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.spec_artifact_digest }}
          MANIFEST_SHA256: ${{ inputs.spec_candidate_manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.spec_source_commit }}
        run: |
          for digest in "$ARTIFACT_DIGEST" "$MANIFEST_SHA256"; do
            test "${#digest}" -eq 64
            case "$digest" in *[!a-f0-9]*) echo "spec candidate digest is invalid" >&2; exit 1 ;; esac
          done
          test "${#SOURCE_COMMIT}" -eq 40
          test "$(sha256sum spec-candidate/candidate-artifact.json | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(jq -r .source.commit spec-candidate/candidate-artifact.json)" = "$SOURCE_COMMIT"
          test "$(jq -r .component.kind spec-candidate/candidate-artifact.json)" = "spec"
          set -- spec-candidate/soksak-ai-plugin-spec-*.tgz
          test "$#" -eq 1
          mkdir spec-package
          tar -xzf "$1" -C spec-package --strip-components=1
          test -z "$(find spec-package -type l -print -quit)"
          node spec-package/release-template/verify-candidate-artifact.mjs \
            --directory "$GITHUB_WORKSPACE/spec-candidate"
          node spec-package/release-template/write-candidate-input-receipt.mjs \
            --directory "$GITHUB_WORKSPACE/spec-candidate" \
            --artifact-name "$ARTIFACT_NAME" --artifact-digest "$ARTIFACT_DIGEST" \
            --candidate-manifest-sha256 "$MANIFEST_SHA256" \
            --out "$GITHUB_WORKSPACE/spec-validation.json"
      - name: Verify the contract build input
        id: contract
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.contract_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.contract_artifact_digest }}
          MANIFEST_SHA256: ${{ inputs.contract_candidate_manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.contract_source_commit }}
        run: |
          for digest in "$ARTIFACT_DIGEST" "$MANIFEST_SHA256"; do
            test "${#digest}" -eq 64
            case "$digest" in *[!a-f0-9]*) echo "contract candidate digest is invalid" >&2; exit 1 ;; esac
          done
          test "$(sha256sum contract-candidate/candidate-artifact.json | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(jq -r .source.commit contract-candidate/candidate-artifact.json)" = "$SOURCE_COMMIT"
          test "$(jq -r .component.kind contract-candidate/candidate-artifact.json)" = "contract"
          node spec-package/release-template/verify-candidate-artifact.mjs \
            --directory "$GITHUB_WORKSPACE/contract-candidate"
          node spec-package/release-template/write-candidate-input-receipt.mjs \
            --directory "$GITHUB_WORKSPACE/contract-candidate" \
            --artifact-name "$ARTIFACT_NAME" --artifact-digest "$ARTIFACT_DIGEST" \
            --candidate-manifest-sha256 "$MANIFEST_SHA256" \
            --out "$GITHUB_WORKSPACE/contract-input.json"
          archive=$(jq -r '.artifacts[] | select(.target == "any") | .url | split("/")[-1]' contract-candidate/release.json)
          sha256=$(jq -r '.artifacts[] | select(.target == "any") | .sha256' contract-candidate/release.json)
          test -f "contract-candidate/$archive"
          test "$(sha256sum "contract-candidate/$archive" | awk '{print $1}')" = "$sha256"
          dependency_name="@soksak/$(jq -r .component.id contract-candidate/candidate-artifact.json)"
          echo "archive=$GITHUB_WORKSPACE/contract-candidate/$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "dependency_name=$dependency_name" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: source/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.node-version
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Declare the isolated candidate stage
        shell: bash
        env:
          DEPENDENCY_NAME: ${{ steps.contract.outputs.dependency_name }}
          DEPENDENCY_ARCHIVE: ${{ steps.contract.outputs.archive }}
          DEPENDENCY_SHA256: ${{ steps.contract.outputs.sha256 }}
        run: |
          node -e '
            const fs=require("fs"),p=require(process.argv[1]);
            const declared={...(p.dependencies||{}),...(p.devDependencies||{}),...(p.peerDependencies||{}),...(p.optionalDependencies||{})};
            if (!(process.env.DEPENDENCY_NAME in declared)) throw new Error("contract candidate is not declared by source");
            fs.writeFileSync(process.argv[2], JSON.stringify({packagePath:"package.json",dependencies:[{
              name:process.env.DEPENDENCY_NAME,artifact:process.env.DEPENDENCY_ARCHIVE,sha256:process.env.DEPENDENCY_SHA256
            }]},null,2)+"\n");
          ' source/package.json "$GITHUB_WORKSPACE/stage-plan.json"
          mkdir stage component-output
      - name: Stage the exact source and dependency
        run: >-
          node spec-package/release-template/stage-node-candidate.mjs
          --source "$GITHUB_WORKSPACE/source"
          --out "$GITHUB_WORKSPACE/stage"
          --plan "$GITHUB_WORKSPACE/stage-plan.json"
      - name: Build and verify the kit candidate
        run: >-
          node spec-package/release-template/build-node-candidate.mjs
          --stage "$GITHUB_WORKSPACE/stage"
          --out "$GITHUB_WORKSPACE/component-output"
          --kind portable
          --generated dist
      - name: Seal the kit candidate
        id: seal
        shell: bash
        run: |
          cp spec-validation.json component-output/spec-validation.json
          cp contract-input.json component-output/contract-input.json
          node spec-package/release-template/seal-candidate-artifact.mjs \
            --directory "$GITHUB_WORKSPACE/component-output" \
            --evidence contract-input.json \
            --evidence spec-validation.json
          node spec-package/release-template/verify-candidate-artifact.mjs \
            --directory "$GITHUB_WORKSPACE/component-output"
          echo "manifest_sha256=$(sha256sum component-output/candidate-artifact.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Name the artifact from verified component identity
        id: identity
        shell: bash
        run: |
          id=$(jq -r .component.id component-output/candidate-artifact.json)
          test "$id" = "$(jq -r .id source/kit.json)"
          echo "artifact_name=candidate-$id-${{ steps.source.outputs.commit }}" >> "$GITHUB_OUTPUT"
      - name: Upload the sealed kit candidate
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: component-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
